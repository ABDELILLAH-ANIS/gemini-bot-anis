services:
  - type: web
    name: gemini-sub-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: LAHA_API_KEY
        sync: false
      - key: LAHA_SHOP_ID
        sync: false
      - key: ACCZONE_API_KEY
        sync: false
